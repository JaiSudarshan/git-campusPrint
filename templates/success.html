<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - CampusPrint</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5 mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5">
                    <div class="mb-3">
                        <span class="display-3 text-success">✅</span>
                    </div>
                    <h2 class="fw-bold text-success mb-2">Payment Successful!</h2>
                    <p class="text-muted mb-4">Your order has been placed. A campus runner will deliver your printout directly to your classroom.</p>

                    <div class="card bg-light border-0 p-3 text-start mb-4 rounded-3">
                        <h6 class="fw-bold text-secondary mb-3 border-bottom pb-2">Order Summary</h6>
                        <p class="mb-2"><strong>File:</strong> {{ filename }}</p>
                        <p class="mb-2"><strong>Print Type:</strong> {{ print_type }}</p>
                        <p class="mb-2"><strong>Copies:</strong> {{ copies }}</p>
                        <p class="mb-2"><strong>Payment Method:</strong> <span class="badge bg-success">UPI Paid</span></p>
                        <p class="mb-0"><strong>Delivery Location:</strong> <span class="text-primary fw-semibold">{{ classroom }}</span></p>
                    </div>

                    <a href="/" class="btn btn-primary btn-lg rounded-pill px-4 shadow-sm w-100">Place Another Order</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
